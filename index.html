<div id="menu" class="menu">

    <img src="menuwallpaper.PNG" class="menu-background">

    </div>

</div>

<style>
/* 三本線 */
.menu-button {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1001;
    background: none;
    border: none;
    padding: 10px;
}

.menu-button span {
    display: block;
    width: 35px;
    height: 5px;
    background: red;
    margin: 6px 0;
}

/* メニュー */
.menu {
    position: fixed;
    top: 0;
    right: -600px;
    width: 600px;
    height: 100%;
    object-fit: contain;
    z-index: 1000;
    overflow: hidden;
    transition: right 0.3s;
}

/* メニューを開いた状態 */
.menu.open {
    right: 0;
}

/* 背景画像 */
.menu-background {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
}

/* 画像の上に乗せる文字 */
.menu-links {
    position: relative;
    z-index: 1;
    padding-top: 100px;
}

.menu-links a {
    display: block;
    padding: 25px;
    color: red;
    font-size: 24px;
    font-weight: bold;
    text-decoration: none;
}
</style>

<script>
function toggleMenu() {
    document.getElementById("menu").classList.toggle("open");
}
</script>
