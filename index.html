<!-- 押した時に流す動画 -->
<video id="secretVideo" src="音割れゆっくりしんちゃん.mp4"
       style="display:none;"
       playsinline>
</video>

<script>
const button = document.getElementById("dontPushButton");
const video = document.getElementById("secretVideo");

/* 5〜15秒後に出現 */
const appearTime = Math.random() * 10000 + 5000;

setTimeout(() => {

    /* 60%の確率で出現 */
    if (Math.random() < 0.6) {

        button.style.display = "block";

        /* 2秒後に消える */
        setTimeout(() => {
            button.style.display = "none";
        }, 2000);
    }

}, appearTime);


/* 押されたら動画再生 */
button.addEventListener("click", () => {

    button.style.display = "none";

    video.style.display = "block";
    video.volume = 1.0;

    video.play();
});
    // 動画が終わったら消す
video.addEventListener("ended", () => {
    video.style.display = "none";
    video.currentTime = 0;
}, { once: true });
</script>
